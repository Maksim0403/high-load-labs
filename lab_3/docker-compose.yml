services:
  db:
    image: postgres:17-alpine
    env_file:
      - ../infrastructure/.env.db
    volumes:
      - lab3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: deployment/Dockerfile
    env_file:
      - ../infrastructure/.env.backend
    environment:
      DB_HOST: db
      LAB3_DELAY_MS: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  backend-slow:
    build:
      context: ../backend
      dockerfile: deployment/Dockerfile
    env_file:
      - ../infrastructure/.env.backend
    environment:
      DB_HOST: db
      LAB3_DELAY_MS: "500"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 30s
    profiles: ["latency"]

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LAB3_UPSTREAM_CONFIG:-./upstream-round-robin.conf}:/etc/nginx/upstream.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lab3_postgres_data:
